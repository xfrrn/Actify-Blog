# Include in nginx's http context. Install a valid certificate at these paths.
limit_req_zone $binary_remote_addr zone=actify_login:10m rate=5r/m;

server {
    listen 80;
    server_name actify.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name actify.cc;
    ssl_certificate /etc/letsencrypt/live/actify.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/actify.cc/privkey.pem;
    client_max_body_size 10m;

    # Generate this trusted-IP file from Cloudflare's official ranges; see docs/admin.md.
    include /etc/nginx/snippets/actify-cloudflare.conf;
    real_ip_header CF-Connecting-IP;

    location = /api/admin/login {
        limit_req zone=actify_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
